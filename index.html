<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mackinac Shack</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: #111;
            background: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            position: fixed;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
        }

        header h1 {
            font-weight: 700;
            font-size: 1.8rem;
        }

        nav a {
            margin-left: 2rem;
            font-weight: 500;
        }

        .hero {
            height: 100vh;
            background: url('https://via.placeholder.com/1500x900') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero h2 {
            color: white;
            font-size: 3rem;
            background-color: rgba(0,0,0,0.4);
            padding: 1rem 2rem;
        }

        section {
            padding: 5rem 10%;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }

        .menu-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }

        .menu-item {
            border: 1px solid #ddd;
            overflow: hidden;
            text-align: center;
        }

        .menu-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .menu-item h3 {
            margin: 1rem 0;
        }

        footer {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 3rem 0;
            margin-top: 5rem;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
            }

            nav {
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Mackinac Shack</h1>
        <nav>
            <a href="#">Menu</a>
            <a href="#">Locations</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="hero">
        <h2>Welcome to Mackinac Shack</h2>
    </div>

    <section>
        <h2 class="section-title">Featured Dishes</h2>
        <div class="menu-items">
            <div class="menu-item">
                <img src="https://via.placeholder.com/400x300" alt="Dish 1">
                <h3></h3>
            </div>
            <div class="menu-item">
                <img src="https://via.placeholder.com/400x300" alt="Dish 2">
                <h3></h3>
            </div>
            <div class="menu-item">
                <img src="https://via.placeholder.com/400x300" alt="Dish 3">
                <h3></h3>
            </div>
            <div class="menu-item">
                <img src="https://via.placeholder.com/400x300" alt="Dish 4">
                <h3></h3>
            </div>
        </div>
    </section>

    <section>
        <h2 class="section-title">Our Story</h2>
        <p style="text-align:center; max-width:600px; margin:auto;">[Placeholder text about Mackinac Shack. Fill in later.]</p>
    </section>

    <footer>
        <p>&copy; 2025 Mackinac Shack. All rights reserved.</p>
    </footer>
</body>
</html>
